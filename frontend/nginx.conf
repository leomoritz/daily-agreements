# Config do Nginx para servir o build estático do frontend (Vite) e
# encaminhar as chamadas de API para o serviço `backend` do docker-compose,
# reproduzindo em produção o mesmo proxy usado em dev (frontend/vite.config.ts).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota desconhecida cai no index.html (client-side routing).
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health {
    proxy_pass http://backend:3001/health;
  }

  location /tasks {
    proxy_pass http://backend:3001/tasks;
  }

  location /tipos-de-acordo {
    proxy_pass http://backend:3001/tipos-de-acordo;
  }

  location /motivos-de-nao-cumprimento {
    proxy_pass http://backend:3001/motivos-de-nao-cumprimento;
  }

  location /usuarios {
    proxy_pass http://backend:3001/usuarios;
  }
}
